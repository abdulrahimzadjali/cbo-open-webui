name: Build feature branch image (CBO)

# Builds the full image from source (the main Dockerfile) for feature branches
# so new backend/frontend code can be tested before it reaches `custom`.
#
# Deliberately separate from publish-cbo-docker.yml: that workflow builds
# Dockerfile.cbo on top of upstream's prebuilt image (so it would not contain
# feature code), tags `:latest` and updates the `cbo-latest` release. This one
# only pushes branch and sha tags, e.g.
#   ghcr.io/<owner>/<repo>:feature-prompt-guardian
#   ghcr.io/<owner>/<repo>:sha-4354a88

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

concurrency:
  group: feature-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  guardian-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Prompt Guardian unit tests
        working-directory: backend
        run: |
          pip install --quiet pytest fastapi pydantic
          python -m pytest open_webui/cbo/guardian/tests -q

  build-and-push:
    needs: guardian-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space for the full image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=CBO AI feature build (${{ github.ref_name }})
            org.opencontainers.image.title=CBO AI

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=feature
          cache-from: type=gha,scope=feature-image
          cache-to: type=gha,mode=max,scope=feature-image

      - name: Run Prompt Guardian e2e checks inside the image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          docker pull "$IMAGE"
          docker run --rm -e PYTHONIOENCODING=utf-8 "$IMAGE" python /app/backend/cbo_e2e.py

      - name: Summary
        run: |
          {
            echo "### Image built"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Run locally:"
            echo
            echo '```bash'
            echo "docker run -d --name cbo-guardian -p 3000:8080 -v cbo-guardian-data:/app/backend/data ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(echo '${{ github.sha }}' | cut -c1-7)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
